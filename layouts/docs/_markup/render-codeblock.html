<!-- Chroma Render Hook -->
{{ $result := transform.HighlightCodeBlock . }}
{{ $lang := .Type | default "text" }}
{{ $langUpper := $lang | upper }}
<div class="code-snippet">
    <div class="lang-toolbar">
        <span class="lang-toolbar__item lang-toolbar__item-active">{{ $langUpper }}</span>
        <span class="code-clipboard">
            <button class="code-clipboard__button" data-code-snippet aria-label="Copy code to clipboard">
                <span>Copy</span>
            </button>
        </span>
        <div class="lang-toolbar__border"></div>
    </div>
    <div class="code-snippet__content">
        {{ $result.Wrapped }}
    </div>
</div>
